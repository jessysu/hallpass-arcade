<!doctype html>
<meta charset="utf-8">
<title>Hallpass Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky header with search, filter chips, auto-fill card grid; the player view swaps in for the grid. Single dark look on purpose (arcade screen). */
:root{
  --ink:#0e1322; --panel:#171e33; --line:#273150; --fg:#e8ecf7; --muted:#8d97b5; --pass:#ffd23f;
  --cell:#26304f; --cell-open:#141a2d; --scrim:rgba(10,14,26,.82);
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
[hidden]{display:none!important}
body{font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pass);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding-block:16px 12px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:22px;display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.logo .tag{background:var(--pass);color:var(--ink);font-size:10px;padding:4px 8px;border-radius:3px;transform:rotate(-5deg);letter-spacing:.04em}
.search{flex:1 1 220px;min-width:0}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:10px 14px;border-radius:8px;font:inherit}
.search input::placeholder{color:var(--muted)}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--pass)}
.btn.primary{background:var(--pass);color:var(--ink);border-color:var(--pass);font-weight:700}
.intro{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;padding-block:28px 6px}
.intro h1{margin:0;font:400 clamp(26px,5vw,44px)/1.05 var(--display);text-wrap:balance;max-width:16ch}
.intro p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding-block:18px}
.chip{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c,var(--pass));outline:none}
.card canvas{width:100%;aspect-ratio:16/10;display:block;max-width:100%}
.meta{padding:10px 12px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline}
.meta h3{margin:0;font:400 14px var(--display)}
.meta .kind{font-size:12px;color:var(--muted);text-align:right}
.meta .best{grid-column:1/-1;font:500 11px var(--mono);color:var(--c,var(--pass))}
.empty{color:var(--muted);padding:40px 0}
/* player */
.pbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:18px 14px}
.pbar h2{margin:0;font:400 20px var(--display);flex:1 1 auto;color:var(--c,var(--fg))}
.stats{display:flex;gap:14px;font:500 13px var(--mono);color:var(--muted)}
.stats b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
#stagewrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:center}
#stagewrap:fullscreen{border-radius:0;align-items:flex-start;overflow-y:auto}
#stagewrap:fullscreen #stage{min-height:100%}
#stagewrap.fs #stage .row{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;max-width:820px;padding-bottom:4px}
#stagewrap.fs #stage .row>*{flex:none}
#stage{display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center;min-height:280px;width:100%}
.new{font:700 9px var(--mono);background:var(--c,var(--pass));color:var(--ink);padding:2px 5px;border-radius:3px;vertical-align:middle;letter-spacing:.06em;margin-left:4px}
#stage canvas{display:block;max-width:100%;border-radius:8px;touch-action:none;user-select:none}
#overlay{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;border-radius:12px;padding:16px}
.ovbox{text-align:center;display:grid;gap:10px;justify-items:center}
.ovbox h3{margin:0;font:400 28px var(--display);color:var(--c,var(--pass))}
.ovbox p{margin:0;color:var(--fg);max-width:40ch}
.ovbox .rec{font:700 12px var(--mono);color:var(--ink);background:var(--pass);padding:3px 8px;border-radius:3px;letter-spacing:.06em}
.howto{color:var(--muted);font-size:14px;max-width:70ch}
.howto b{color:var(--fg)}
/* DOM games */
.dom{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px;width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font:500 13px var(--mono);color:var(--muted)}
.mf{--cs:min(38px,calc((100vw - 90px)/9));display:grid;grid-template-columns:repeat(9,var(--cs));gap:3px}
.mfc{width:var(--cs);height:var(--cs);border:0;border-radius:4px;background:var(--cell);font:700 15px var(--mono);cursor:pointer;padding:0;color:var(--fg)}
.mfc:hover:not(.open){filter:brightness(1.25)}
.mfc.open{background:var(--cell-open);cursor:default}
.mfc.flag{color:var(--pass)}
.mfc.boom{background:#b4233a}
.mfc[data-n="1"]{color:#60a5fa}.mfc[data-n="2"]{color:#4ade80}.mfc[data-n="3"]{color:#f87171}.mfc[data-n="4"]{color:#c084fc}.mfc[data-n="5"]{color:#fb923c}.mfc[data-n="6"]{color:#2dd4bf}
.pairs{--ps:min(82px,calc((100vw - 100px)/4));display:grid;grid-template-columns:repeat(4,var(--ps));gap:10px}
.pc{width:var(--ps);height:var(--ps);border-radius:10px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,var(--cell) 0 8px,var(--cell-open) 8px 16px);cursor:pointer;font-size:calc(var(--ps)*.45);padding:0;transition:transform .2s}
.pc span{visibility:hidden}
.pc.up{background:var(--cell-open);transform:rotateY(180deg)}
.pc.up span{visibility:visible;display:inline-block;transform:rotateY(180deg)}
.pc.got{border-color:var(--pass);opacity:.75}
.ttt{--ts:min(96px,calc((100vw - 90px)/3));display:grid;grid-template-columns:repeat(3,var(--ts));gap:6px}
.tc{width:var(--ts);height:var(--ts);background:var(--cell);border:0;border-radius:8px;font:400 calc(var(--ts)*.45) var(--display);cursor:pointer;padding:0}
.tc.x{color:#818cf8}.tc.o{color:#f472b6}.tc.win{background:#3b3a1c}
.tk-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;width:100%;max-width:820px}
.tk-stat{background:var(--cell);border:0;padding:7px 9px;border-radius:6px;text-align:left;font:500 12px var(--mono);cursor:pointer;display:flex;justify-content:space-between;gap:6px;align-items:center}
.tk-stat:hover:not(:disabled){filter:brightness(1.25)}
.tk-stat:disabled{opacity:.5;cursor:default}
.tk-stat i{font-style:normal;color:var(--muted)}
.tk-stat b{color:var(--c,var(--pass));letter-spacing:-1px;font-weight:700}
.tree-ov{position:absolute;inset:0;z-index:6;background:rgba(10,14,26,.97);border-radius:12px;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.tree-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tree-head h3{margin:0;font:400 18px var(--display);color:var(--c,var(--pass))}
.tree-head select{background:var(--cell);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;max-width:100%}
.tree-note{color:var(--muted);font-size:13px;flex:1 1 200px}
.tree-cols{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.tree-col{display:flex;flex-direction:column;gap:8px;flex:none;width:160px}
.tree-col h4{margin:0;font:700 10px var(--mono);color:var(--muted);letter-spacing:.06em}
.tree-node{background:var(--cell);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;text-align:left;display:grid;gap:3px;color:var(--fg)}
.tree-node:hover{border-color:var(--muted)}
.tree-node.sel{border-color:var(--pass);box-shadow:0 0 0 1px var(--pass)}
.tree-node canvas{width:100%;height:auto;border-radius:5px;display:block}
.tree-node b{font:700 12px var(--body)}
.tree-node small{font:500 10px var(--mono);color:var(--muted);line-height:1.35}
.od-menu{display:grid;gap:14px;justify-items:center;text-align:center;padding-block:28px;width:100%;max-width:820px}
.od-menu h3{margin:0;font:400 24px var(--display);color:var(--c,var(--pass))}
.od-menu p{margin:0;color:var(--muted);max-width:60ch}
.od-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%}
.od-mode{background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start}
.od-mode:hover,.od-mode:focus-visible{border-color:var(--c,var(--pass))}
.od-mode b{font:400 15px var(--display);color:var(--fg)}
.od-mode span{color:var(--muted);font-size:13px;line-height:1.45}
.tk-pts{font:700 12px var(--mono);color:var(--pass);align-self:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <button class="logo" id="home-link" aria-label="Hallpass Arcade home">HALLPASS <span class="tag">ARCADE</span></button>
    <div class="search"><input id="q" type="search" placeholder="Search 8 games" aria-label="Search games"></div>
    <button class="btn" id="random">Random game</button>
  </header>

  <main id="home">
    <div class="intro">
      <div>
        <h1>Quick games for the five minutes you have.</h1>
        <p>Every game runs in the page. No downloads, no sign-ups. Your best scores are kept in this browser.</p>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No games match that search.</p>
  </main>

  <section id="player" hidden>
    <div class="pbar">
      <button class="btn" id="back">← All games</button>
      <h2 id="ptitle"></h2>
      <div class="stats"><span><span id="slabel">Score</span> <b id="score">0</b></span><span>Best <b id="best">–</b></span></div>
      <button class="btn" id="restart">Restart</button>
      <button class="btn" id="full">Fullscreen</button>
    </div>
    <div id="stagewrap">
      <div id="stage"></div>
      <div id="overlay" hidden>
        <div class="ovbox">
          <h3 id="ovtitle"></h3>
          <p id="ovtext"></p>
          <span class="rec" id="ovrec" hidden>NEW BEST</span>
          <button class="btn primary" id="again">Play again</button>
        </div>
      </div>
    </div>
    <p class="howto" id="howto"></p>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const key=e=>e.key.length===1?e.key.toLowerCase():e.key;
const DIRS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,String(v))}catch(e){return null}}
const games=[];const reg=g=>games.push(g);
const FONT='"JetBrains Mono",monospace';

/* ---------- Coil ---------- */
reg({id:'coil',title:'Coil',kind:'Arcade',color:'#4ade80',unit:'',
how:'<b>Arrow keys</b> or <b>WASD</b> to steer, or <b>swipe</b> on a touch screen. Eat the red dots to grow. Hitting a wall or your own tail ends the run.',
thumb(x,W,H){x.fillStyle='#10261a';x.fillRect(0,0,W,H);const s=16;x.fillStyle='#4ade80';[[5,6],[6,6],[7,6],[8,6],[8,7],[8,8],[9,8],[10,8],[11,8],[12,8]].forEach(([i,j])=>x.fillRect(i*s+1,j*s+1,s-2,s-2));x.fillStyle='#f87171';x.beginPath();x.arc(15*s+8,8*s+8,6,0,7);x.fill()},
start(st,a){
  const N=20,S=20,c=a.canvas(N*S,N*S),x=c.getContext('2d');
  let snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}],dir={x:1,y:0},next=dir,acc=0,step=.13,score=0;
  const spot=()=>{let p;do{p={x:rnd(N),y:rnd(N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p};
  let food=spot();
  const turn=(dx,dy)=>{if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy}};
  a.on(window,'keydown',e=>{const d=DIRS[key(e)];if(d){e.preventDefault();turn(...d)}});
  a.swipe(c,turn);
  const draw=()=>{
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){x.fillStyle=(i+j)%2?'#10261a':'#132c1f';x.fillRect(i*S,j*S,S,S)}
    x.fillStyle='#f87171';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.35,0,7);x.fill();
    snake.forEach((s,i)=>{x.fillStyle=i?'#4ade80':'#bbf7d0';x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)});
  };
  a.loop(dt=>{
    acc+=dt;
    while(acc>=step){
      acc-=step;dir=next;
      const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
      const eats=h.x===food.x&&h.y===food.y;
      const body=eats?snake:snake.slice(0,-1);
      if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(s=>s.x===h.x&&s.y===h.y)){draw();a.over(score,'Crashed',`You ate ${score} dot${score===1?'':'s'}.`);return false}
      snake.unshift(h);
      if(eats){score++;a.score(score);food=spot();step=Math.max(.06,step-.003)}else snake.pop();
    }
    draw();
  });
}});

/* ---------- Shatter ---------- */
reg({id:'shatter',title:'Shatter',kind:'Arcade',color:'#f472b6',unit:'',
how:'Move the paddle with the <b>mouse</b>, your <b>finger</b>, or the <b>arrow keys</b>. <b>Click</b> or press <b>Space</b> to launch. Clear every brick to reach the next level. You have three balls.',
thumb(x,W,H){x.fillStyle='#1d1027';x.fillRect(0,0,W,H);for(let r=0;r<4;r++)for(let c=0;c<8;c++){x.fillStyle=`hsl(${(r*40+300)%360} 80% 65%)`;x.fillRect(12+c*37,24+r*18,33,13)}x.fillStyle='#f9fafb';x.fillRect(130,176,60,8);x.beginPath();x.arc(175,140,6,0,7);x.fill()},
start(st,a){
  const W=480,H=600,c=a.canvas(W,H),x=c.getContext('2d'),pw=84,py=H-36;
  let px=W/2,ball,bricks,lives=3,score=0,level=1,held=true;const keys={};
  const build=()=>{bricks=[];const cols=8,rows=Math.min(4+level,8),bw=(W-20)/cols;for(let r=0;r<rows;r++)for(let k=0;k<cols;k++)bricks.push({x:10+k*bw+2,y:64+r*24,w:bw-4,h:18,col:`hsl(${(r*40+300)%360} 80% 65%)`})};
  const reset=()=>{ball={x:px,y:py-12,vx:0,vy:0,r:7};held=true};
  const launch=()=>{if(!held)return;held=false;const sp=330+level*30,an=-Math.PI/2+(Math.random()-.5)*.8;ball.vx=Math.cos(an)*sp;ball.vy=Math.sin(an)*sp};
  build();reset();
  a.on(c,'pointermove',e=>{px=a.pos(c,e).x});
  a.on(c,'pointerdown',e=>{px=a.pos(c,e).x;launch()});
  a.on(window,'keydown',e=>{const k=key(e);if(k===' '){e.preventDefault();launch()}if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();keys[k]=1}});
  a.on(window,'keyup',e=>{delete keys[key(e)]});
  const draw=()=>{
    x.fillStyle='#1d1027';x.fillRect(0,0,W,H);
    bricks.forEach(b=>{x.fillStyle=b.col;x.fillRect(b.x,b.y,b.w,b.h)});
    x.fillStyle='#f9fafb';x.fillRect(px-pw/2,py,pw,12);
    x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();
    x.font=`700 14px ${FONT}`;x.fillStyle='#c9b8d9';x.textAlign='left';x.fillText(`LEVEL ${level}`,12,28);
    x.textAlign='right';x.fillText('● '.repeat(lives).trim(),W-12,28);
    if(held){x.textAlign='center';x.fillStyle='#f9fafb';x.fillText('Click or press Space to launch',W/2,H/2+80)}
  };
  a.loop(dt=>{
    if(keys.ArrowLeft)px-=520*dt;if(keys.ArrowRight)px+=520*dt;
    px=clamp(px,pw/2,W-pw/2);
    if(held){ball.x=px;ball.y=py-ball.r-1}
    else{
      const r=ball.r;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
      if(ball.x<r){ball.x=r;ball.vx=Math.abs(ball.vx)}
      if(ball.x>W-r){ball.x=W-r;ball.vx=-Math.abs(ball.vx)}
      if(ball.y<r){ball.y=r;ball.vy=Math.abs(ball.vy)}
      if(ball.vy>0&&ball.y+r>=py&&ball.y-r<=py+12&&Math.abs(ball.x-px)<=pw/2+r){
        const t=clamp((ball.x-px)/(pw/2),-1,1),sp=Math.hypot(ball.vx,ball.vy),an=-Math.PI/2+t*1.05;
        ball.vx=Math.cos(an)*sp;ball.vy=Math.sin(an)*sp;ball.y=py-r;
      }
      for(let i=0;i<bricks.length;i++){
        const b=bricks[i],nx=clamp(ball.x,b.x,b.x+b.w),ny=clamp(ball.y,b.y,b.y+b.h);
        if((ball.x-nx)**2+(ball.y-ny)**2<=r*r){
          const ox=ball.x-ball.vx*dt;
          if(ox<b.x||ox>b.x+b.w)ball.vx*=-1;else ball.vy*=-1;
          bricks.splice(i,1);score+=10;a.score(score);break;
        }
      }
      if(ball.y>H+20){
        lives--;
        if(lives<=0){draw();a.over(score,'Out of balls',`${score} points. You reached level ${level}.`);return false}
        reset();
      }
      if(!bricks.length){level++;build();reset()}
    }
    draw();
  });
}});

/* ---------- Hop Dash ---------- */
reg({id:'hop',title:'Hop Dash',kind:'Arcade',color:'#22d3ee',unit:' m',
how:'Press <b>Space</b>, <b>Up</b>, or <b>tap</b> to jump over the blocks. The track speeds up the longer you last.',
thumb(x,W,H){x.fillStyle='#0b1f2a';x.fillRect(0,0,W,H);x.fillStyle='#164e63';x.fillRect(0,150,W,50);x.fillStyle='#22d3ee';x.save();x.translate(84,110);x.rotate(.4);x.fillRect(-14,-14,28,28);x.restore();x.fillStyle='#f1f5f9';x.fillRect(170,122,18,28);x.fillRect(250,110,26,40)},
start(st,a){
  const W=640,H=260,G=214,c=a.canvas(W,H),x=c.getContext('2d'),P=80,SZ=28;
  let y=0,vy=0,obs=[],speed=320,dist=0,spawn=1.2,rot=0,score=0;
  const dots=Array.from({length:30},()=>[Math.random()*W,G+8+Math.random()*36]);
  const jump=()=>{if(y<=0)vy=650};
  a.on(window,'keydown',e=>{const k=key(e);if(k===' '||k==='ArrowUp'||k==='w'){e.preventDefault();jump()}});
  a.on(c,'pointerdown',jump);
  const draw=()=>{
    x.fillStyle='#0b1f2a';x.fillRect(0,0,W,H);
    x.fillStyle='#164e63';x.fillRect(0,G,W,H-G);
    x.fillStyle='#1f6f86';dots.forEach(d=>x.fillRect(d[0],d[1],3,3));
    x.fillStyle='#f1f5f9';obs.forEach(o=>x.fillRect(o.x,G-o.h,o.w,o.h));
    x.save();x.translate(P+SZ/2,G-y-SZ/2);x.rotate(rot);x.fillStyle='#22d3ee';x.fillRect(-SZ/2,-SZ/2,SZ,SZ);x.restore();
  };

function ctl(a,c){
  const s={keys:{},aim:null,fire:false,touch:null};
  a.on(window,'keydown',e=>{const k=key(e);if(DIRS[k]||k===' '){e.preventDefault();s.keys[k]=1}});
  a.on(window,'keyup',e=>{delete s.keys[key(e)]});
  a.on(c,'pointermove',e=>{const p=a.pos(c,e);if(e.pointerType==='mouse')s.aim=p;else if(s.touch)s.touch=p});
  a.on(c,'pointerdown',e=>{const p=a.pos(c,e);if(e.pointerType==='mouse'){s.aim=p;s.fire=true}else{s.touch=p;try{c.setPointerCapture(e.pointerId)}catch(_){}}});
  a.on(window,'pointerup',e=>{if(e.pointerType==='mouse')s.fire=false;else s.touch=null});
  a.on(c,'pointercancel',()=>{s.touch=null});
  a.on(c,'contextmenu',e=>e.preventDefault());
  s.move=(px,py)=>{let mx=0,my=0;for(const k in s.keys){const d=DIRS[k];if(d){mx+=d[0];my+=d[1]}}
    if(s.touch){const dx=s.touch.x-px,dy=s.touch.y-py,d=Math.hypot(dx,dy);if(d>24){mx=dx/d;my=dy/d}}
    const m=Math.hypot(mx,my);return m?{x:mx/m,y:my/m}:{x:0,y:0}};
  s.firing=()=>s.fire||!!s.keys[' '];
  return s;
}

    if(p.lives<=0){a.over(score,'Overrun',`You held out until wave ${wave} with ${score} points.`);return false}

/* ---------- Gravity Duel ---------- */
reg({id:'duel',title:'Gravity Duel',kind:'Space',color:'#fb7185',unit:' wins',label:'Wins',
how:'Two ships circle a small star. Turn with <b>A / D</b> or <b>Left / Right</b>, thrust with <b>W</b> or <b>Up</b>, fire with <b>Space</b>. The star pulls you in and burns anything that touches it, and the arena wraps at the edges. First to 3 hits wins the match, and every match you win brings a sharper opponent. Switch to <b>2 players</b> to duel a friend on one keyboard: Player 1 keeps <b>WASD + Space</b>, Player 2 uses the <b>arrows + Enter</b>. Touch buttons sit under the arena.',
thumb(x,W,H){x.fillStyle='#140a12';x.fillRect(0,0,W,H);x.fillStyle='#fff';for(let i=0;i<30;i++)x.fillRect((i*89)%W,(i*47)%H,1.2,1.2);const g=x.createRadialGradient(160,100,4,160,100,50);g.addColorStop(0,'#fff7ed');g.addColorStop(.3,'#fb923c');g.addColorStop(1,'rgba(251,146,60,0)');x.fillStyle=g;x.beginPath();x.arc(160,100,50,0,7);x.fill();x.strokeStyle='#4a2433';x.setLineDash([3,6]);x.beginPath();x.ellipse(160,100,120,70,0,0,7);x.stroke();x.setLineDash([]);SP.ship(x,45,110,1.6,12,'#fb7185');SP.ship(x,275,90,-1.5,12,'#93c5fd')},
start(st,a){
  const W=720,H=460,c=a.canvas(W,H),x=c.getContext('2d'),CX=W/2,CY=H/2,GM=1.4e6,SUN=22,WIN=3;
  let two=false,level=1,won=0,pts=[0,0],ships=[],shots=[],fx=[],pause=0,msg='',after=null;
  const keys={},tk={};const stars=SP.stars(90,W,H);
  const GAME_KEYS=['a','d','w',' ','ArrowLeft','ArrowRight','ArrowUp','Enter','/'];
  a.on(window,'keydown',e=>{const k=key(e);if(GAME_KEYS.includes(k)){e.preventDefault();keys[k]=1}});
  a.on(window,'keyup',e=>{delete keys[key(e)]});
  const bar=document.createElement('div');bar.className='row';
  const mode=document.createElement('button');mode.className='btn';mode.id='duel-mode';
  const setMode=()=>mode.textContent=two?'Mode: 2 players':'Mode: vs computer';setMode();
  const tb=(lbl,k)=>{const b=document.createElement('button');b.className='btn';b.textContent=lbl;b.style.touchAction='none';b.style.userSelect='none';
    a.on(b,'pointerdown',e=>{e.preventDefault();tk[k]=1});['pointerup','pointerleave','pointercancel'].forEach(ev=>a.on(b,ev,()=>tk[k]=0));return b};
  bar.append(mode,tb('◀ Turn','l'),tb('Turn ▶','r'),tb('Thrust','t'),tb('Fire','f'));st.append(bar);
  const newRound=()=>{
    const v=Math.sqrt(GM/230);
    ships=[{x:CX-230,y:CY,vx:0,vy:v,a:Math.PI/2,alive:true,cd:0,col:'#fb7185'},{x:CX+230,y:CY,vx:0,vy:-v,a:-Math.PI/2,alive:true,cd:.6,col:'#93c5fd'}];
    shots=[];
  };
  a.on(mode,'click',()=>{two=!two;setMode();level=1;won=0;a.score(0);pts=[0,0];msg='';pause=0;newRound();mode.blur()});
  const cpu=(s,o)=>{
    const skill=Math.min(1,.3+level*.12);
    const dx=o.x-s.x,dy=o.y-s.y,d=Math.hypot(dx,dy),lead=d/420*skill;
    const want=Math.atan2(o.y+o.vy*lead-s.y,o.x+o.vx*lead-s.x);
    const sx=s.x-CX,sy=s.y-CY,sd=Math.hypot(sx,sy)||1,vin=-(sx*s.vx+sy*s.vy)/sd;
    let target=want,thrust=false,avoid=false;
    if(sd<110||(sd<200&&vin>70)){target=Math.atan2(sy,sx)+.7;thrust=true;avoid=true}
    const diff=wrapAng(target-s.a),tol=.06+(1-skill)*.3;
    return{l:diff<-tol*.4,r:diff>tol*.4,t:thrust||(d>300&&Math.abs(diff)<.4&&Math.random()<.25),f:!avoid&&Math.abs(diff)<tol&&d<430&&Math.random()<.15+skill*.5};
  };
  const kill=(i,why)=>{const s=ships[i];if(!s.alive)return;s.alive=false;SP.burst(fx,s.x,s.y,s.col,40,240)};
  const settle=()=>{
    const [A,B]=ships.map(s=>s.alive);
    if(A===B){msg='Both ships lost. No point.'}
    else{const w=A?0:1;pts[w]++;msg=two?`Player ${w+1} scores`:(w===0?'Hit!':'The computer scores')}
    pause=1.6;
    if(pts[0]>=WIN||pts[1]>=WIN){
      const w=pts[0]>=WIN?0:1;
      if(two){msg=`Player ${w+1} wins the match ${pts[w]}-${pts[1-w]}`;after=()=>{pts=[0,0]}}
      else if(w===0){won++;a.score(won);level++;msg=`Match won ${pts[0]}-${pts[1]}. Next opponent: level ${level}`;after=()=>{pts=[0,0]}}
      else{after=()=>{a.over(won,'Shot down',`You won ${won} match${won===1?'':'es'} before the computer took one ${pts[1]}-${pts[0]}.`);return true}}
      pause=2.4;
    }
  };
  newRound();
  a.loop(dt=>{
    const k1=two?{l:keys.a||tk.l,r:keys.d||tk.r,t:keys.w||tk.t,f:keys[' ']||tk.f}:{l:keys.a||keys.ArrowLeft||tk.l,r:keys.d||keys.ArrowRight||tk.r,t:keys.w||keys.ArrowUp||tk.t,f:keys[' ']||tk.f};
    const k2=two?{l:keys.ArrowLeft,r:keys.ArrowRight,t:keys.ArrowUp,f:keys.Enter||keys['/']}:cpu(ships[1],ships[0]);
    const roundLive=ships.every(s=>s.alive);
    [k1,k2].forEach((k,i)=>{
      const s=ships[i];if(!s.alive)return;
      if(roundLive||pause>0){
        if(k.l)s.a-=4*dt;if(k.r)s.a+=4*dt;s.thr=!!k.t;
        if(k.t){s.vx+=Math.cos(s.a)*200*dt;s.vy+=Math.sin(s.a)*200*dt}
      }
      const gx=CX-s.x,gy=CY-s.y,d2=gx*gx+gy*gy,d=Math.sqrt(d2)||1,g=GM/Math.max(d2,900);
      s.vx+=gx/d*g*dt;s.vy+=gy/d*g*dt;
      const v=Math.hypot(s.vx,s.vy);if(v>320){s.vx*=320/v;s.vy*=320/v}
      s.x=(s.x+s.vx*dt+W)%W;s.y=(s.y+s.vy*dt+H)%H;
      s.cd-=dt;
      if(roundLive&&k.f&&s.cd<=0&&shots.filter(b=>b.o===i).length<4){s.cd=.28;shots.push({o:i,x:s.x+Math.cos(s.a)*14,y:s.y+Math.sin(s.a)*14,vx:s.vx+Math.cos(s.a)*380,vy:s.vy+Math.sin(s.a)*380,t:0})}
      if(d<SUN+8)kill(i);
    });
    for(const b of shots){
      b.x=(b.x+b.vx*dt+W)%W;b.y=(b.y+b.vy*dt+H)%H;b.t+=dt;
      if(Math.hypot(b.x-CX,b.y-CY)<SUN)b.t=9;
      const o=ships[1-b.o];if(o.alive&&Math.hypot(b.x-o.x,b.y-o.y)<12){b.t=9;kill(1-b.o)}
    }
    shots=shots.filter(b=>b.t<1.5);
    if(ships[0].alive&&ships[1].alive&&Math.hypot(ships[0].x-ships[1].x,ships[0].y-ships[1].y)<20){kill(0);kill(1)}
    if(roundLive&&!ships.every(s=>s.alive))settle();
    fx=SP.stepFx(fx,dt);
    if(pause>0){pause-=dt;if(pause<=0){msg='';if(after){const f=after;after=null;if(f()){draw();return false}}newRound()}}
    draw();
  });
  function draw(){
    x.fillStyle='#140a12';x.fillRect(0,0,W,H);
    SP.drawStars(x,stars,0,0,W,H);
    const g=x.createRadialGradient(CX,CY,4,CX,CY,70);g.addColorStop(0,'#fff7ed');g.addColorStop(.3,'#fb923c');g.addColorStop(1,'rgba(251,146,60,0)');
    x.fillStyle=g;x.beginPath();x.arc(CX,CY,70,0,7);x.fill();
    ships.forEach(s=>{if(s.alive)SP.ship(x,s.x,s.y,s.a,11,s.col,1,s.thr)});
    shots.forEach(b=>{x.fillStyle=ships[b.o].col;x.beginPath();x.arc(b.x,b.y,2.6,0,7);x.fill()});
    SP.drawFx(x,fx);
    x.font=`700 15px ${FONT}`;x.textAlign='left';x.fillStyle='#fb7185';x.fillText(`${two?'P1':'YOU'}  ${pts[0]}`,14,24);
    x.textAlign='right';x.fillStyle='#93c5fd';x.fillText(`${pts[1]}  ${two?'P2':`CPU LV ${level}`}`,W-14,24);
    if(msg){x.textAlign='center';x.fillStyle='#fde68a';x.font=`700 20px ${FONT}`;x.fillText(msg,W/2,H/2-90)}
  }
}});

/* ---------- Shell ---------- */
let current=null,cleanups=[];
const stage=$('#stage'),overlay=$('#overlay');
const bestOf=g=>{const v=store('hp-best-'+g.id);return v==null||v===''?null:+v};
const fmt=(g,v)=>v==null?'–':`${v}${g.unit}`;
function makeApi(g){
  return{
    score(n){$('#score').textContent=n},
    over(final,title,text){
      let best=bestOf(g),rec=false;
      if(final!=null&&(best==null||(g.lower?final<best:final>best))){store('hp-best-'+g.id,final);best=final;rec=true}
      $('#best').textContent=fmt(g,best);
      $('#ovtitle').textContent=title;$('#ovtext').textContent=text;$('#ovrec').hidden=!rec;
      overlay.hidden=false;$('#again').focus({preventScroll:true});
    },
    on(t,type,fn,opt){t.addEventListener(type,fn,opt);cleanups.push(()=>t.removeEventListener(type,fn,opt))},
    timeout(fn,ms){const id=setTimeout(fn,ms);cleanups.push(()=>clearTimeout(id))},
    loop(fn){let id,last=performance.now();const f=t=>{const dt=Math.min(50,t-last)/1000;last=t;if(fn(dt)!==false)id=requestAnimationFrame(f)};id=requestAnimationFrame(f);cleanups.push(()=>cancelAnimationFrame(id))},
    canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.style.width=`min(100%, calc((100dvh - var(--chrome, 240px)) * ${w/h}))`;c.style.minWidth=`min(100%, ${Math.round(260*w/h)}px)`;stage.appendChild(c);return c},
    pos(c,e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}},
    swipe(el,fn){let s=null;this.on(el,'pointerdown',e=>{s={x:e.clientX,y:e.clientY}});this.on(el,'pointerup',e=>{if(!s)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;s=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;Math.abs(dx)>Math.abs(dy)?fn(Math.sign(dx),0):fn(0,Math.sign(dy))})}
  };
}
function stop(){cleanups.forEach(f=>f());cleanups=[]}
function play(g){
  stop();stage.innerHTML='';overlay.hidden=true;
  $('#score').textContent=0;$('#best').textContent=fmt(g,bestOf(g));
  g.start(stage,makeApi(g));
}
function open(g){
  current=g;$('#home').hidden=true;$('#player').hidden=false;
  document.documentElement.style.setProperty('--c',g.color);
  $('#ptitle').textContent=g.title;$('#slabel').textContent=g.label||'Score';$('#howto').innerHTML=g.how;
  window.scrollTo(0,0);play(g);
}
function home(){
  stop();stage.innerHTML='';current=null;
  document.documentElement.style.removeProperty('--c');
  $('#player').hidden=true;$('#home').hidden=false;
  games.forEach(g=>{const el=document.querySelector(`[data-best="${g.id}"]`);if(el){const v=bestOf(g);el.textContent=v==null?'Not played yet':`Best ${fmt(g,v)}`}});
}
function route(){const g=games.find(g=>g.id===location.hash.slice(1));if(g)open(g);else home()}
const go=g=>{if(location.hash.slice(1)===g.id)open(g);else location.hash=g.id};

// cards
const grid=$('#grid');
games.forEach(g=>{
  const b=document.createElement('button');b.className='card';b.dataset.id=g.id;b.style.setProperty('--c',g.color);
  const c=document.createElement('canvas');c.width=320;c.height=200;g.thumb(c.getContext('2d'),320,200);
  b.innerHTML=`<div class="meta"><h3>${g.title}${g.fresh?'<span class="new">NEW</span>':''}</h3><span class="kind">${g.kind}</span><span class="best" data-best="${g.id}"></span></div>`;
  b.prepend(c);b.addEventListener('click',()=>go(g));grid.appendChild(b);
});
$('#q').placeholder=`Search ${games.length} games`;
// filters
let kind='All';
const kinds=['All',...new Set(games.map(g=>g.kind))];
kinds.forEach(k=>{const b=document.createElement('button');b.className='chip';b.textContent=k;b.setAttribute('aria-pressed',k===kind);
  b.addEventListener('click',()=>{kind=k;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.textContent===k));filter()});$('#chips').appendChild(b)});
function filter(){
  const q=$('#q').value.trim().toLowerCase();let n=0;
  games.forEach(g=>{const show=(kind==='All'||g.kind===kind)&&(!q||(g.title+' '+g.kind).toLowerCase().includes(q));document.querySelector(`.card[data-id="${g.id}"]`).hidden=!show;if(show)n++});
  $('#empty').hidden=n>0;
}
$('#q').addEventListener('input',()=>{if(current)location.hash='';filter()});
$('#random').addEventListener('click',()=>{const pool=games.filter(g=>g!==current);go(pool[rnd(pool.length)])});
$('#back').addEventListener('click',()=>{location.hash=''});
$('#home-link').addEventListener('click',()=>{location.hash=''});
$('#restart').addEventListener('click',()=>current&&play(current));
$('#again').addEventListener('click',()=>current&&play(current));
$('#full').addEventListener('click',()=>{const w=$('#stagewrap');try{(document.fullscreenElement?document.exitFullscreen():w.requestFullscreen()).catch(()=>{})}catch(e){}});
// In fullscreen, shrink the game canvas so the controls under it (like the tank stats panel) stay on screen.
function fitFullscreen(){
  const w=$('#stagewrap');
  const on=document.fullscreenElement===w;w.classList.toggle('fs',on);
  if(!on){w.style.removeProperty('--chrome');return}
  const cv=stage.querySelector('canvas');if(!cv)return;
  const others=[...stage.children].filter(el=>el!==cv&&!el.hidden).reduce((s,el)=>s+el.offsetHeight+10,0);
  w.style.setProperty('--chrome',Math.min(others+40,Math.round(innerHeight*.5))+'px');
}
document.addEventListener('fullscreenchange',fitFullscreen);addEventListener('resize',fitFullscreen);setInterval(fitFullscreen,600);
addEventListener('hashchange',route);
route();
</script>
